<!doctype html>
<html lang="en" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<title>Quick Diwali Entries</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
:root{--night:#080D2C;--panel:#10173F;--gold:#F6C453;--muted:#B9BFDD;--line:rgba(255,255,255,.16);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--night);color:#fff;font:15px/1.5 'Poppins','Noto Sans Devanagari',system-ui,sans-serif}
main{max-width:860px;margin:0 auto;padding:28px max(18px,env(safe-area-inset-left,0px)) 40px}
h1{font-size:21px;font-weight:600;margin:0}
.muted{color:var(--muted);font-size:13px}
input{width:100%;min-height:48px;padding:10px 12px;font:inherit;font-size:16px;color:#fff;background:var(--panel);border:1px solid var(--line);border-radius:8px}
input:focus{outline:2px solid var(--gold);outline-offset:0}
button{appearance:none;border:1px solid var(--line);border-radius:8px;background:none;color:#fff;font:inherit;font-size:14px;min-height:44px;padding:8px 14px;cursor:pointer}
button.main{background:var(--gold);border-color:var(--gold);color:#241300;font-weight:500}
button:focus-visible{outline:2px solid #fff;outline-offset:2px}
#login{max-width:340px;margin:18vh auto 0;display:flex;flex-direction:column;gap:14px}
#err{color:#FFB4A0;font-size:14px;min-height:1.4em;margin:0}
.head{display:flex;flex-wrap:wrap;gap:12px;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.tools{display:flex;flex-wrap:wrap;gap:8px;margin:14px 0}
.tools input{flex:1 1 200px;min-height:44px;font-size:15px}
.wrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse;min-width:560px}
th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:10px 12px;border-bottom:1px solid var(--line)}
td{padding:10px 12px;border-bottom:1px solid rgba(255,255,255,.07);font-size:14px}
tr:last-child td{border-bottom:0}
td.n{font-variant-numeric:tabular-nums;user-select:all;white-space:nowrap}
#empty{padding:30px;text-align:center;color:var(--muted)}
</style>
</head>
<body>
<main>
  <form id="login">
    <h1>Quick Diwali entries</h1>
    <label class="muted" for="pw">Admin password</label>
    <input type="password" id="pw" autocomplete="current-password" required>
    <button class="main" type="submit">Open</button>
    <p id="err" role="alert"></p>
  </form>
  <section id="list" hidden>
    <div class="head"><h1><span id="count">0</span> people</h1><span class="muted" id="stamp"></span></div>
    <div class="tools">
      <input type="search" id="q" placeholder="Search name or number" aria-label="Search name or number">
      <button type="button" id="refresh">Refresh</button>
      <button type="button" id="copy">Copy numbers</button>
      <button type="button" id="csv">Download CSV</button>
    </div>
    <p class="muted" id="note" role="status" style="min-height:1.5em;margin:0 0 8px"></p>
    <div class="wrap">
      <table><thead><tr><th>Name</th><th>Phone</th><th>Language</th><th>Certificates</th><th>Last made</th></tr></thead><tbody id="rows"></tbody></table>
      <p id="empty" hidden>No entries yet.</p>
    </div>
  </section>
</main>
<script>
(function () {
  const URL_BASE = 'https://rifduxeclyoijyyeivms.supabase.co', KEY = 'sb_publishable_94JJenAfwsYotB5SWi_2DA_qWAzFOJl';
  const $ = s => document.querySelector(s);
  let password = '', all = [];
  const when = v => new Date(v).toLocaleString('en-IN', { timeZone: 'Asia/Kolkata', day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit' });
  async function load() {
    const r = await fetch(URL_BASE + '/rest/v1/rpc/get_leads', { method: 'POST', headers: { apikey: KEY, 'Content-Type': 'application/json' }, body: JSON.stringify({ p_password: password }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(/wrong password/.test(e.message || '') ? 'password' : 'network'); }
    all = await r.json(); render(); $('#stamp').textContent = 'Updated ' + when(new Date());
  }
  function shown() { const q = $('#q').value.trim().toLowerCase(); return q ? all.filter(l => l.name.toLowerCase().includes(q) || l.phone.includes(q)) : all; }
  function render() {
    const list = shown(), body = $('#rows'); body.textContent = ''; $('#count').textContent = all.length; $('#empty').hidden = all.length > 0;
    list.forEach(l => {
      const tr = document.createElement('tr');
      [l.name, l.phone, l.lang === 'en' ? 'English' : 'Hindi', l.certificates, when(l.last_at)].forEach((v, i) => { const td = document.createElement('td'); td.textContent = v; if (i === 1) td.className = 'n'; tr.append(td); });
      body.append(tr);
    });
  }
  $('#login').addEventListener('submit', async e => {
    e.preventDefault(); password = $('#pw').value; $('#err').textContent = '';
    try { await load(); $('#login').hidden = true; $('#list').hidden = false; $('#pw').value = ''; }
    catch (x) { password = ''; $('#err').textContent = x.message === 'password' ? 'That password is not correct.' : 'Could not reach the database. Check your connection and try again.'; }
  });
  $('#q').addEventListener('input', render);
  $('#refresh').addEventListener('click', async () => { try { await load(); $('#note').textContent = ''; } catch (x) { $('#note').textContent = 'Could not refresh. Try again.'; } });
  $('#copy').addEventListener('click', async () => {
    const text = shown().map(l => l.phone).join('\n');
    try { await navigator.clipboard.writeText(text); $('#note').textContent = 'Copied ' + shown().length + ' numbers.'; } catch (x) { $('#note').textContent = 'Copy failed. Use Download CSV.'; }
  });
  $('#csv').addEventListener('click', () => {
    const cell = v => { let s = String(v); if (/^[=+\-@]/.test(s)) s = "'" + s; return '"' + s.replace(/"/g, '""') + '"'; };
    const lines = [['Name', 'Phone', 'Language', 'Certificates', 'First made', 'Last made'].map(cell).join(',')].concat(all.map(l => [l.name, l.phone, l.lang === 'en' ? 'English' : 'Hindi', l.certificates, when(l.first_at), when(l.last_at)].map(cell).join(',')));
    const url = URL.createObjectURL(new Blob(['﻿' + lines.join('\r\n')], { type: 'text/csv;charset=utf-8' }));
    const a = document.createElement('a'); a.href = url; a.download = 'quick-diwali-entries.csv'; document.body.append(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000);
  });
})();
</script>
</body>
</html>
